<template>

<style>

#f1-ring{position:absolute;left:118px;top:377px;width:844px;height:264px;border:8px solid #ffc53d;border-radius:30px;opacity:0}
#f1-dots{position:absolute;left:0;top:730px;width:1080px;display:flex;justify-content:center;gap:26px}

</style>
<div class="bg clip" data-start="0" data-duration="8.5" data-track-index="0"></div>
<div id="f1-dial"></div>
<div id="f1-kick" class="kick"></div>
<div id="f1-grp">
  <div id="f1-wrap"><div id="f1-odo"></div></div>
  <div id="f1-ring"></div>
  <div id="f1-dots"></div>
</div>
<div id="f1-l1"></div>
<div id="f1-l2"></div>
<div id="f1-pillw" style="position:absolute;left:0;top:870px;width:1080px;text-align:center"><span id="f1-pill" class="pill" style="position:static"></span></div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
/*ODO_JS*/
(function () {
  var D = {
    ru: { kick: "ДНЕЙ ВЫ УЖЕ ПРОЖИЛИ", l1: "Через 8 дней", l2: "вам будет 12 345 дней.", pill: "Это красивое число.", sep: "" },
    en: { kick: "DAYS YOU’VE LIVED", l1: "In 8 days", l2: "you’ll be 12,345 days old.", pill: "That’s a beautiful number.", sep: "," }
  }[HF_LANG];
  document.getElementById("f1-kick").textContent = D.kick;
  document.getElementById("f1-l1").textContent = D.l1;
  document.getElementById("f1-l2").textContent = D.l2; if (HF_LANG === "en") document.getElementById("f1-l2").style.fontSize = "56px";
  document.getElementById("f1-pill").textContent = D.pill;
  makeDial(document.getElementById("f1-dial"), 900, "#1d4ed8");
  var odo = makeOdo(document.getElementById("f1-odo"), { n: 5, cw: 150, ch: 230, fs: 190, sep: D.sep });
  var dots = document.getElementById("f1-dots"), dh = "";
  for (var i = 0; i < 8; i++) dh += '<div class="f1-dot"></div>';
  dots.innerHTML = dh;
  var dotEls = dots.children;
  var steps = [];
  for (var i = 0; i <= 8; i++) steps.push({ t: 0.5 * i - 0.12, dur: 0.4, add: 1 });
  var proxy = { t: 0 };
  function render() {
    var t = proxy.t;
    odo.draw(stepsValue(12336, steps, t), stepsValue(12336, steps, t - 0.03), t > 4.35 && t < 6.2);
    document.getElementById("f1-dial").style.transform = "rotate(" + beatRot(t, 6, 0.5, 0.2).toFixed(2) + "deg)";
    for (var i = 0; i < 8; i++) {
      var on = t > 0.5 * (i + 1) + 0.15;
      var amber = t > 4.35;
      dotEls[i].style.background = on ? (amber ? "#ffc53d" : "#1d4ed8") : "transparent";
      dotEls[i].style.borderColor = amber && on ? "#ffc53d" : "#1d4ed8";
    }
  }
  var tl = gsap.timeline({ paused: true });
  tl.to(proxy, { t: 8.5, duration: 8.5, ease: "none", onUpdate: render }, 0);
  /* hook: kicker slams in on first beat, drums already spinning */
  tl.fromTo("#f1-kick", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, 0);
  tl.fromTo("#f1-dots", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.1);
  /* stop beat */
  tl.fromTo("#f1-wrap", { scale: 1 }, { scale: 1.07, duration: 0.14, ease: "power2.out", transformOrigin: "50% 50%", immediateRender: false }, 4.3);
  tl.to("#f1-wrap", { scale: 1, duration: 0.4, ease: "elastic.out(1,0.5)", transformOrigin: "50% 50%" }, 4.44);
  tl.fromTo("#f1-ring", { opacity: 0.95, scale: 0.92 }, { opacity: 0, scale: 1.35, duration: 0.9, ease: "power2.out", transformOrigin: "50% 50%", immediateRender: false }, 4.3);
  /* counter group moves up, message arrives */
  tl.to("#f1-grp", { y: -190, duration: 0.7, ease: "power3.inOut" }, 4.6);
  tl.to("#f1-dots", { opacity: 0, duration: 0.3 }, 4.6);
  tl.to("#f1-kick", { opacity: 0, duration: 0.3 }, 4.6);

  tl.fromTo("#f1-pillw", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2.2)", transformOrigin: "50% 50%" }, 6.5);
  render();
  window.__timelines["01-odometer"] = tl;
})();
</script>
