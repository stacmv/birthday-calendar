<!doctype html>

          display: inline-block;

            <div><span id="f04-c2" class="f04-chip"></span></div>

      <script>
        (function () {
          var vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
          var L = (window.__hfLang || vars.lang) === "en" ? "en" : "ru";
          var T = {
            ru: { h: "Введите дату <em>один раз</em>.", p: "Дальше календарь открывается сразу.", c1: "Работает без интернета", c2: "Ставится на телефон" },

          document.getElementById("f04-c2").textContent = T.c2;

          tl.fromTo("#f04-p", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 2.2);
          tl.fromTo("#f04-c1", { opacity: 0, y: 24, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.7)" }, 4.2);
          tl.fromTo("#f04-c2", { opacity: 0, y: 24, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.7)" }, 5.2);

          window.__timelines["f04-remember"] = tl;
