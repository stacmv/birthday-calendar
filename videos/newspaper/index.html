<!doctype html>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,

      }

        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;

      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>

    <script>
      window.__timelines = window.__timelines || {};

      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { x: -1080, duration: 0.5, ease: "power3.inOut" }, 8);
        tl.fromTo("#el-02-product", { x: 1080, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 8);
        tl.to("#el-02-product", { x: -1080, duration: 0.5, ease: "power3.inOut" }, 15);
        tl.fromTo("#el-03-numbers", { x: 1080, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 15);

        tl.to("#el-05-remember", { x: -1080, duration: 0.5, ease: "power3.inOut" }, 42);

        tl.fromTo("#el-07-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 50);
        tl.to({}, { duration: 60 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
