  <div id="root" data-composition-id="01-hook" data-start="0" data-duration="6" data-width="1080" data-height="1080">
    <div id="f1-bg" class="f1-bg clip" data-start="0" data-duration="6" data-track-index="0"></div>
    <div id="f1-row" class="clip" data-start="0" data-duration="6" data-track-index="1" style="position:absolute;inset:0;">
      <div class="f1-d" id="f1-d0">1</div>
      <div class="f1-d" id="f1-d1">1</div>

  </div>
  <script>
    (function () {
      var SLOT = [135, 285, 495, 645, 795]; // left px of each 150px slot: "11 111" with a 60px group gap
      var CENTER = 465;
      var tl = gsap.timeline({ paused: true });
      var d = [0, 1, 2, 3, 4].map(function (i) { return document.getElementById("f1-d" + i); });
      d.forEach(function (el, i) { gsap.set(el, { left: SLOT[i] }); });
      gsap.set(d[0], { x: CENTER - SLOT[0] });
      // 1) lone 1 lies on its side, then stands up (overshoot)
      tl.fromTo(d[0], { rotation: -90, opacity: 1 }, { rotation: 0, duration: 0.7, ease: "back.out(2.2)" }, 0.35);
      tl.fromTo(d[0], { scaleY: 1 }, { scaleY: 0.93, duration: 0.09, yoyo: true, repeat: 1, ease: "power1.out" }, 1.0);
      // 2) first slides to slot 0, four more join on the beat
      tl.to(d[0], { x: 0, duration: 0.55, ease: "power3.inOut" }, 1.3);
      var T = [1.35, 1.9, 2.45, 3.0];
      for (var i = 1; i <= 4; i++) {
        tl.fromTo(d[i], { y: -420, opacity: 0, scale: 0.6, rotation: i % 2 ? -14 : 14 },

        tl.fromTo(d[i], { color: "#1D4ED8" }, { color: "#182033", duration: 0.5, ease: "power1.out" }, T[i - 1] + 0.3);
      }
      // 3) the row breathes, then settles at the hand-off state
      tl.to("#f1-row", { scale: 1.04, duration: 0.8, ease: "sine.inOut", transformOrigin: "50% 46%" }, 3.7);
      tl.to("#f1-row", { scale: 1, duration: 0.8, ease: "sine.inOut" }, 4.5);
      window.__timelines["01-hook"] = tl;
